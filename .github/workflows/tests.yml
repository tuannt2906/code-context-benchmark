name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit + integration tests (stdlib only, no API calls)
        run: python -B -m unittest discover -s tests -v
      - name: Ground truth reproduces exactly
        run: python -B -m ccbench build-dataset --check
