name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is no longer shipped for ubuntu-latest runners; 3.9 is verified locally (all results were produced on 3.9.6)
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit + integration tests (stdlib only, no API calls)
        run: python -B -m unittest discover -s tests -v
      - name: Ground truth reproduces exactly
        run: python -B -m ccbench build-dataset --check
